name: Release

# Push a tag like v1.0.0 (matching AppInfo.Version in server/reader.cs and an entry in CHANGELOG.md):
# builds the container image for Intel/AMD and ARM, publishes it to ghcr.io, and creates the GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in the code
        run: |
          code="$(grep -oP 'Version = "\K[^"]+' server/reader.cs)"
          if [ "v$code" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match AppInfo.Version $code"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # this version's section of CHANGELOG.md, without its heading or link
          awk -v v="[$version]" '/^## \[/ { on = index($0, v) > 0; next } on && !/^\[[0-9]/' CHANGELOG.md > notes.md
          {
            echo
            echo "### Run it"
            echo
            echo '```bash'
            echo "docker run -d -p 5199:5199 -v reader-reborn-data:/data ghcr.io/${GITHUB_REPOSITORY}:${version}"
            echo '```'
            echo
            echo "Then open http://localhost:5199. Podman works the same way."
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "Reader Reborn $version" --notes-file notes.md
