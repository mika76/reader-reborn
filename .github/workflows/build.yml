name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: web
      - name: Unit tests (store.js, format.js)
        run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Smoke test in a headless browser
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        working-directory: web

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build server/reader.cs
      - name: API and feed parser tests
        run: dotnet test --project tests/Server.Tests

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t reader-reborn .
