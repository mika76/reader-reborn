# Run Reader with Docker or Podman:
#   docker compose up -d     or     podman compose up -d
# then open http://localhost:5199. The databases are kept in the reader-data volume.
services:
  reader:
    build: .
    image: localhost/reader:latest
    ports:
      - "${READER_PORT:-5199}:5199"   # READER_PORT=8080 podman compose up -d to use another port
    volumes:
      - reader-data:/data
    environment:
      READER_INTERVAL: "30"     # minutes between checks of each feed
      # READER_IMAGES: "off"    # don't save copies of post images
    restart: unless-stopped

volumes:
  reader-data:
